<title>Panzi — Info Email Processing</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.11.1/lib/msal-browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #f5bf60; --gold-dk: #d4a030; --black: #1a1816;
  --bg: #f5f4f1; --surface: #fff; --border: #e2e0db;
  --text: #1a1816; --text2: #6b6860;
  --green: #2d5f3f; --green-l: #ebf2ed;
  --blue: #1a4a7a; --blue-l: #e8f0f8;
  --red: #8b2020; --red-l: #fdf0f0;
  --orange: #b85c00; --orange-l: #fdf3e8;
  --sh: 0 1px 3px rgba(0,0,0,.08); --sh-md: 0 4px 16px rgba(0,0,0,.12);
  --r: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; font-size: 14px; }

/* Sign-in screen */
.signin-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--black);
}
.signin-card {
  background: white; border-radius: 12px; padding: 40px; text-align: center;
  max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.signin-logo { height: 36px; margin-bottom: 20px; }
.signin-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--black); }
.signin-sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
.btn-signin {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  background: #0078d4; color: white; font-size: 14px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-signin:hover { background: #006cbd; }
.btn-signin svg { width: 20px; height: 20px; }

// ── Auth ──────────────────────────────────────────────────────────────────────
async function initAuth() {
  await msalInstance.initialize();
  
  // Handle redirect response
  const response = await msalInstance.handleRedirectPromise();
  if (response) {
    currentUser = response.account;
  } else {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) currentUser = accounts[0];
  }

  if (currentUser) {
    showApp();
  } else {
    document.getElementById('signin-screen').style.display = 'flex';
  }
}

document.getElementById('btn-signin').addEventListener('click', async () => {
  await msalInstance.loginRedirect(loginRequest);
});

document.getElementById('btn-refresh').addEventListener('click', () => {
  toast('Refreshing&#8230;');
  loadEmails();
});
document.getElementById('btn-signout').addEventListener('click', () => {
  msalInstance.logoutRedirect({ account: currentUser });
});

function showApp() {
  document.getElementById('signin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = currentUser.name || currentUser.username;
  loadWebhooks();
  loadEmails();
  setupEvents();
}

// ── Data (GitHub JSON) ────────────────────────────────────────────────────────
const GITHUB_USER = 'mpledger-panzi';
const GITHUB_REPO = 'panzi-info-email-triage';
// emails loaded individually from data/emails/ folder
const GUIDE_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/data/guide.json';

async function writeEmailToGitHub(email) {
  if (!webhooks.githubToken) return;
  try {
    // First get the current file SHA (needed to update)
    const getRes = await fetch(
      'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/data/emails/' + email.id + '.json',
      {headers: {'Authorization': 'Bearer ' + webhooks.githubToken, 'User-Agent': 'PanziApp'}}
    );
    if (!getRes.ok) return;
    const fileData = await getRes.json();
    const sha = fileData.sha;

    // Write updated file
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(email))));
    await fetch(
      'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/data/emails/' + email.id + '.json',
      {
        method: 'PUT',
        headers: {'Authorization': 'Bearer ' + webhooks.githubToken, 'Content-Type': 'application/json', 'User-Agent': 'PanziApp'},
        body: JSON.stringify({message: 'Update email ' + email.id, content, sha})
      }
    );
  } catch(e) { console.error('GitHub write error:', e); }
}

async function loadEmails() {
  try {
    const listRes = await fetch(
      'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/data/emails?t=' + Date.now(),
      {headers: {'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'PanziApp'}}
    );
    console.log('GitHub list status:', listRes.status);
    if (!listRes.ok) {
      const err = await listRes.text();
      console.error('GitHub list error:', err);
      toast('Could not load emails: ' + listRes.status);
      emails = []; render(); return;
    }
    const files = await listRes.json();
    console.log('Files found:', files.length);
    const jsonFiles = files.filter(f => f.name.endsWith('.json') && f.name !== '.gitkeep');
    console.log('JSON files:', jsonFiles.map(f => f.name));

    const results = await Promise.all(jsonFiles.map(async f => {
      try {
        const r = await fetch(f.download_url + '?t=' + Date.now());
        if (!r.ok) { console.error('Failed to fetch', f.name, r.status); return null; }
        const data = await r.json();
        console.log('Loaded:', f.name, data.status, data.category);
        return data;
      } catch(e) { console.error('Parse error', f.name, e); return null; }
    }));

    emails = results.filter(Boolean).sort((a,b) => new Date(b.receivedDate) - new Date(a.receivedDate));
    console.log('Total emails loaded:', emails.length);
    render();
  } catch(e) {
    console.error('loadEmails error:', e);
    toast('Error loading emails: ' + e.message);
    emails = []; render();
  }
}

async function loadGuide() {
  try {
    const res = await fetch(GUIDE_URL + '?t=' + Date.now());
    if (res.ok) guide = await res.json();
    else guide = [];
  } catch(e) { guide = []; }
}

function loadWebhooks() {
  try {
    const saved = localStorage.getItem('panzi-webhooks');
    if (saved) webhooks = Object.assign(webhooks, JSON.parse(saved));
  } catch(e) {}
}

function saveWebhooks() {
  try { localStorage.setItem('panzi-webhooks', JSON.stringify(webhooks)); } catch(e) {}
}

async function callFlow(url, payload) {
  if (!url) { toast('&#9888; Flow URL not configured \u2014 check Response Guide settings'); return false; }
  try {
    await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    return true;
  } catch(e) { toast('&#9888; Could not reach flow: ' + e.message); return false; }
}

function esc(s) {
  return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

function approveTypeFor(e) {
  return e._approveType || (e.urgency==='high' ? 'reply_forward' : (e.action==='forward' ? 'forward' : 'reply'));
}

function getTypeClass(type) {
  if (type === 'forward') return 'btn-b';
  if (type === 'reply_forward') return 'btn-r';
  return 'btn-g';
}

let _tt;
function toast(m) {
  const t = document.getElementById('toast');
  t.innerHTML = m; t.classList.add('on');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), 3000);
}

// ── Events ────────────────────────────────────────────────────────────────────
function setupEvents() {
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    tab = btn.dataset.tab;
    render();
  });

  

  document.getElementById('main').addEventListener('change', e => {
    const sel = e.target.closest('[data-action="change-category"]');
    if (sel) changeCategory(sel.dataset.id, sel.value);
  });

  document.getElementById('main').addEventListener('click', e => {
    if (!e.target.closest('.approve-wrap')) {
      document.querySelectorAll('.approve-dd.open').forEach(d => d.classList.remove('open'));
    }

    const btn = e.target.closest('[data-action]');
    if (!btn) {
      const hdr = e.target.closest('.card-hdr');
      if (hdr) toggleCard(hdr.closest('.card').dataset.id);
      const ghdr = e.target.closest('.grp-hdr');
      if (ghdr) { const g = ghdr.dataset.grp; collapsedGroups[g] = !collapsedGroups[g]; render(); }
      return;
    }

    const act = btn.dataset.action;
    const id = btn.dataset.id;
    const ci = parseInt(btn.dataset.ci);
    const si = parseInt(btn.dataset.si);

    if (act === 'approve') approveEmail(id);
    else if (act === 'approve-caret') { e.stopPropagation(); const dd = document.getElementById('dd-'+id); if (dd) dd.classList.toggle('open'); }
    else if (act === 'set-type') { const em = emails.find(x=>String(x.id)===String(id)); if(em) em._approveType=btn.dataset.type; document.querySelectorAll('.approve-dd').forEach(d=>d.classList.remove('open')); render(); }
    else if (act === 'edit-reply') toggleEdit(id);
    else if (act === 'save-edit') saveEdit(id);
    else if (act === 'edit-fwd-msg') toggleFwdEdit(id);
    else if (act === 'save-fwd-msg') saveFwdMsg(id);
    else if (act === 'save-route') saveRoute(id);
    else if (act === 'ignore') ignoreEmail(id);
    else if (act === 'back-pending') returnToPending(id);
    else if (act === 'send-all') processAll();
    else if (act === 'cat-filter') { activeCatFilter = btn.dataset.cat; render(); }
    else if (act === 'completed-filter') { completedFilter = btn.dataset.f; render(); }
    else if (act === 'save-webhooks') {
      webhooks.approve = document.getElementById('wh-approve')?.value.trim()||'';
      webhooks.ignore = document.getElementById('wh-ignore')?.value.trim()||'';
      webhooks.draft = document.getElementById('wh-draft')?.value.trim()||'';
      webhooks.githubToken = document.getElementById('wh-github')?.value.trim()||'';
      saveWebhooks(); toast('Saved &#10003;');
    }
    else if (act === 'add-category') addCategory();
    else if (act === 'edit-category') editCategory(ci);
    else if (act === 'delete-category') deleteCategory(ci);
    else if (act === 'add-sub') openSubEditor(ci, -1);
    else if (act === 'edit-sub') openSubEditor(ci, si);
    else if (act === 'delete-sub') deleteSub(ci, si);
  });
}

  '</div>';

function render() {
  const pending = emails.filter(e => !e.status || e.status === 'Pending');
  const approved = emails.filter(e => e.status === 'Approved');
  const completed = emails.filter(e => ['Sent','Forwarded','Ignored','Drafted','Processing'].includes(e.status));

  ['pending','approved','completed'].forEach(k => {
    const el = document.getElementById('n-'+k);
    if (el) el.textContent = k==='pending'?pending.length:k==='approved'?approved.length:completed.length;
  });

  const main = document.getElementById('main');
  if (!main) return;
  if (tab === 'pending') renderPending(main, pending);
  else if (tab === 'approved') renderApproved(main, approved);
  else if (tab === 'completed') renderCompleted(main, completed);
  else if (tab === 'settings' || tab === 'settings-tab') renderSettings(main);
}

function groupByDate(items, mode) {
  const now = new Date();
  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sow = new Date(sod); sow.setDate(sod.getDate() - sod.getDay());
  const solw = new Date(sow); solw.setDate(sow.getDate() - 7);
  const som = new Date(now.getFullYear(), now.getMonth(), 1);
  const groups = [
    {id:'today',label:'Today',items:[]}, {id:'week',label:'This week',items:[]},
    {id:'lweek',label:'Last week',items:[]}, {id:'month',label:'This month',items:[]},
    {id:'older',label:'Older',items:[]},
  ];
  items.forEach(e => {
    const d = e.receivedDate ? new Date(e.receivedDate) : new Date(0);
    if (d>=sod) groups[0].items.push(e);
    else if (d>=sow) groups[1].items.push(e);
    else if (d>=solw) groups[2].items.push(e);
    else if (d>=som) groups[3].items.push(e);
    else groups[4].items.push(e);
  });
  return groups.filter(g=>g.items.length).map(g => {
    const col = !!collapsedGroups[g.id];
    return '<div><div class="grp-hdr" data-grp="'+g.id+'">' +
      '<span class="grp-label">'+g.label+'</span><span class="grp-count">('+g.items.length+')</span>' +
      '<span class="grp-chev'+(col?'':' open')+'">&#9660;</span></div>' +
      '<div'+(col?' style="display:none"':'')+'>'+g.items.map(e=>card(e,mode)).join('')+'</div></div>';
  }).join('');
}

function catFilterBar(items) {
  const cats = [...new Set(items.map(e=>e.category).filter(Boolean))];
  if (cats.length < 2) return '';
  return '<div class="filter-bar">'+['all',...cats].map(c => {
    const label = c==='all'?'All':(CAT_LABELS[c]||c);
    const count = c==='all'?items.length:items.filter(e=>e.category===c).length;
    const active = activeCatFilter===c;
    return '<button class="fbtn'+(active?' active':'')+'" data-action="cat-filter" data-cat="'+c+'">'+esc(label)+' <span style="opacity:.7">'+count+'</span></button>';
  }).join('')+'</div>';
}

function renderPending(main, items) {
  const legend = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">' +
    '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);white-space:nowrap;">How it works</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#10003; <strong style="color:var(--text)">Approve</strong> → Approved tab</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#9998; <strong style="color:var(--text)">Edit</strong> reply or colleague message</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#8599; <strong style="color:var(--text)">Forward</strong> → colleague (&#9660; to switch)</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#10005; <strong style="color:var(--text)">Ignore</strong> → no reply sent</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#128640; <strong style="color:var(--text)">Send All</strong> in Approved tab</span>' +
    '<span style="font-size:12px;color:var(--text2);">&#128276; <strong style="color:var(--text)">Urgent</strong> → Reply + Forward</span>' +
    '</div>';
  if (!items.length) { main.innerHTML = legend+'<div class="empty"><div class="ic">&#9989;</div><h3>All caught up!</h3><p>No pending emails.</p></div>'; return; }
  const filtered = activeCatFilter==='all'?items:items.filter(e=>e.category===activeCatFilter);
  const sorted = [...filtered].sort((a,b)=>(b.urgency==='high'?1:0)-(a.urgency==='high'?1:0));
  main.innerHTML = legend + catFilterBar(items) + groupByDate(sorted,'pending');
}

function renderApproved(main, items) {
  if (!items.length) { main.innerHTML='<div class="empty"><div class="ic">&#128236;</div><h3>Nothing approved yet</h3><p>Approve emails from Pending and they appear here ready to send.</p></div>'; return; }
  const r=items.filter(e=>(e.approveType||approveTypeFor(e))!=='forward').length;
  const f=items.filter(e=>(e.approveType||approveTypeFor(e))==='forward').length;
  const bar='<div class="send-bar"><div class="send-bar-info"><strong>'+items.length+' email'+(items.length!==1?'s':'')+
    '</strong> ready &nbsp;<span style="color:var(--green)">&#9679;</span> '+r+' repl'+(r!==1?'ies':'y')+
    ' &nbsp;<span style="color:var(--blue)">&#9679;</span> '+f+' forward'+(f!==1?'s':'')+
    '</div><button class="btn btn-gold" data-action="send-all">&#128640; Send All</button></div>';
  main.innerHTML = INFO_BAR + bar + groupByDate(items,'approved');
}

function renderCompleted(main, items) {
  const counts = {all:items.length, sent:items.filter(e=>e.status==='Sent').length, forwarded:items.filter(e=>e.status==='Forwarded').length, ignored:items.filter(e=>['Ignored','Drafted'].includes(e.status)).length};
  const filters = ['all','sent','forwarded','ignored'].map(f=>{
    const labels={all:'All',sent:'Sent',forwarded:'Forwarded',ignored:'Ignored'};
    const active=completedFilter===f;
    return '<button class="fbtn'+(active?' active':'')+'" data-action="completed-filter" data-f="'+f+'">'+labels[f]+' <span style="opacity:.7">'+counts[f]+'</span></button>';
  }).join('');
  const filtered=completedFilter==='all'?items:completedFilter==='sent'?items.filter(e=>e.status==='Sent'):completedFilter==='forwarded'?items.filter(e=>e.status==='Forwarded'):items.filter(e=>['Ignored','Drafted'].includes(e.status));
  if(!items.length){main.innerHTML='<div class="empty"><div class="ic">&#128203;</div><h3>Nothing completed yet</h3><p>Sent, forwarded and ignored emails appear here.</p></div>';return;}
  main.innerHTML=INFO_BAR+'<div class="filter-bar">'+filters+'</div>'+(filtered.length?groupByDate(filtered,'history'):'<div class="empty"><div class="ic">&#128269;</div><h3>None in this category</h3><p></p></div>');
}

// ── Card ──────────────────────────────────────────────────────────────────────
function card(e, mode) {
  const isOpen=!!e._expanded, isUrgent=e.urgency==='high', isFwd=e.action==='forward';
  const atype=approveTypeFor(e);
  let cardCls='';
  if(isUrgent)cardCls='urgent';
  else if(isFwd&&mode==='approved')cardCls='is-approved-f';
  else if(isFwd)cardCls='is-fwd';
  else if(mode==='approved')cardCls='is-approved-r';
  let tags='';
  if(isUrgent&&atype==='reply_forward')tags+='<span class="tag tag-rf">&#128276; Urgent &#8213; Reply+Fwd</span>';
  else if(isUrgent)tags+='<span class="tag tag-u">&#128276; Urgent</span>';
  else if(isFwd)tags+='<span class="tag tag-f">&#8599; Forward</span>';
  else if(mode==='pending'||mode==='approved')tags+='<span class="tag tag-r">&#8617; Reply</span>';
  if(e.category)tags+='<span class="tag">'+esc(CAT_LABELS[e.category]||e.category)+'</span>';
  if(mode==='history'){
    const stColors={'Sent':'tag-r','Forwarded':'tag-f','Ignored':'','Processing':'tag-rf'};
    const stLabels={'Sent':'&#8617; Replied','Forwarded':'&#8599; Forwarded','Ignored':'&#10005; Ignored','Processing':'&#8987; Sending...'};
    if(e.status&&stLabels[e.status]) tags+='<span class="tag '+(stColors[e.status]||'')+'" style="font-weight:600;">'+stLabels[e.status]+'</span>';
  }
  return '<div class="card '+cardCls+(isOpen?' open':'')+'" data-id="'+e.id+'">'+
    '<div class="card-hdr"><div class="card-meta">'+
      '<div class="card-from">'+esc(e.from||'Unknown')+'</div>'+
      '<div class="card-subj">'+esc(e.subject||'(no subject)')+'</div>'+
    '</div><div class="card-tags">'+tags+'<span class="chev">&#9660;</span></div></div>'+
    (isOpen?cardBody(e,mode):'')+
  '</div>';
}

      '<div class="fwd-msg" id="fwd-view-'+e.id+'">'+esc(fwdMsg)+'</div>'+
      '<textarea class="draft-textarea" id="fwd-edit-'+e.id+'">'+esc(fwdMsg)+'</textarea>'+
      '<div style="text-align:right;margin-top:6px;display:none;" id="fwd-save-row-'+e.id+'"><button class="btn btn-g btn-sm" data-action="save-fwd-msg" data-id="'+e.id+'">Save</button></div>'+
      '</div>';
  }
  s3+='</div>';

  let actions='';
  if(mode==='pending'){
    const typeCls=getTypeClass(atype);
    const typeLabel={reply:'&#8617; Reply',forward:'&#8599; Forward',reply_forward:'&#8617;&#8599; Reply + Forward'}[atype]||'Approve';
    const isUrg=e.urgency==='high';
    actions='<div class="action-row">'+
      '<div class="approve-wrap">'+
        '<button class="btn '+typeCls+' btn-approve-main" data-action="approve" data-id="'+e.id+'">'+typeLabel+'</button>'+
        '<button class="btn '+typeCls+' btn-approve-caret" data-action="approve-caret" data-id="'+e.id+'">&#9660;</button>'+
        '<div class="approve-dd" id="dd-'+e.id+'">'+
          '<div class="dd-opt'+(atype==='reply'?' sel':'')+'" data-action="set-type" data-id="'+e.id+'" data-type="reply">&#8617; Reply<span class="dd-hint">reply to sender</span></div>'+
          '<div class="dd-opt'+(atype==='forward'?' sel':'')+'" data-action="set-type" data-id="'+e.id+'" data-type="forward">&#8599; Forward<span class="dd-hint">send to colleague</span></div>'+
          '<div class="dd-opt'+(atype==='reply_forward'?' sel':'')+(isUrg?'':' off')+'" data-action="set-type" data-id="'+e.id+'" data-type="reply_forward">&#8617;&#8599; Reply + Forward<span class="dd-hint">urgent only</span></div>'+
        '</div></div>'+
      '<button class="btn btn-del" data-action="ignore" data-id="'+e.id+'">&#10005; Ignore</button>'+
    '</div>';
  } else if(mode==='approved'){
    actions='<div class="action-row">'+
      '<button class="btn btn-ghost btn-sm" data-id="'+e.id+'" id="savebtn-'+e.id+'" data-action="save-edit" style="display:none;">&#10003; Save reply</button>'+
      '<button class="btn btn-del btn-sm" data-action="back-pending" data-id="'+e.id+'">&#8592; Back to Pending</button>'+
    '</div>';
  } else {
    actions='<div class="action-row"><span style="font-size:12px;color:var(--text2);">'+esc(e.status||'')+'</span></div>';
  }

  return '<div class="card-body">'+s1+s2+s3+actions+'</div>';
}

// ── Card actions ──────────────────────────────────────────────────────────────
function toggleCard(id){const e=emails.find(x=>String(x.id)===String(id));if(!e)return;e._expanded=!e._expanded;render();if(e._expanded)setTimeout(()=>document.querySelector('[data-id="'+id+'"]')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);}

function toggleEdit(id){const dv=document.getElementById('dv-'+id),de=document.getElementById('de-'+id),sb=document.getElementById('savebtn-'+id);if(!de)return;const on=de.classList.contains('on');de.classList.toggle('on');if(dv)dv.style.display=on?'block':'none';if(sb)sb.style.display=on?'none':'inline-flex';if(!on)de.focus();}

function toggleFwdEdit(id){const view=document.getElementById('fwd-view-'+id),edit=document.getElementById('fwd-edit-'+id),sr=document.getElementById('fwd-save-row-'+id);if(!edit)return;const on=edit.classList.contains('on');edit.classList.toggle('on');if(view)view.style.display=on?'block':'none';if(sr)sr.style.display=on?'none':'block';if(!on)edit.focus();}

async function saveEdit(id){
  const de=document.getElementById('de-'+id),dv=document.getElementById('dv-'+id),sb=document.getElementById('savebtn-'+id);
  if(!de)return;const txt=de.value.trim();
  const em=emails.find(x=>String(x.id)===String(id));if(em)em.finalReply=txt;
  de.classList.remove('on');if(dv){dv.textContent=txt;dv.style.display='block';}if(sb)sb.style.display='none';
  toast('Reply updated &#10003;');
}

async function saveFwdMsg(id){
  const edit=document.getElementById('fwd-edit-'+id),view=document.getElementById('fwd-view-'+id),sr=document.getElementById('fwd-save-row-'+id);
  if(!edit)return;const txt=edit.value.trim();
  const em=emails.find(x=>String(x.id)===String(id));if(em)em.fwdMsg=txt;
  edit.classList.remove('on');if(view){view.textContent=txt;view.style.display='block';}if(sr)sr.style.display='none';
  toast('Message updated &#10003;');
}

async function saveRoute(id){
  const rt=document.getElementById('rt-'+id),rc=document.getElementById('rc-'+id);if(!rt)return;
  const em=emails.find(x=>String(x.id)===String(id));if(em){em.routeTo=rt.value.trim();if(rc)em.routeToCC=rc.value.trim();}
  toast('Routing saved &#10003;');
}

async function approveEmail(id){
  const e=emails.find(x=>String(x.id)===String(id));if(!e)return;
  const atype=e._approveType||approveTypeFor(e);
  const finalReply=e.finalReply||e.draftBody||'';
  e.status='Approved';e.finalReply=finalReply;e.approveType=atype;e._expanded=false;
  callFlow(webhooks.approve,{id:e.id,messageId:e.messageId,from:e.from,subject:e.subject,draftBody:finalReply,approveType:atype,routeTo:e.routeTo||'',routeToCC:e.routeToCC||'',fwdMsg:e.fwdMsg||''});
  render();toast('Approved &#10003;');
}

async function ignoreEmail(id){
  const e=emails.find(x=>String(x.id)===String(id));if(!e)return;
  e.status='Ignored';e._expanded=false;
  callFlow(webhooks.ignore,{id});
  writeEmailToGitHub(e);
  render();toast('Email ignored');
}

async function returnToPending(id){const e=emails.find(x=>String(x.id)===String(id));if(!e)return;e.status='Pending';e._expanded=false;render();toast('Returned to Pending');}

async function processAll(){
  const approved=emails.filter(e=>e.status==='Approved');
  if(!approved.length){toast('Nothing to send!');return;}
  for(const e of approved){
    callFlow(webhooks.approve,{id:e.id,messageId:e.messageId,from:e.from,subject:e.subject,draftBody:e.finalReply||e.draftBody||'',approveType:e.approveType||approveTypeFor(e),routeTo:e.routeTo||'',routeToCC:e.routeToCC||'',fwdMsg:e.fwdMsg||''});
    e.status='Processing';e._expanded=false;
  }
  render();toast(approved.length+' email'+(approved.length!==1?'s':'')+' sent &#10003;');
}

async function changeCategory(id,newCat){
  const em=emails.find(x=>String(x.id)===String(id));if(!em)return;
  em.category=newCat;
  if(guide){
    for(const cat of guide){
      for(const sub of(cat.subs||[])){
        if(sub.claudeCategory===newCat&&sub.replyText){
          em.draftBody=sub.replyText;em.finalReply=sub.replyText;
          em.action=sub.action;em.routeTo=sub.routeTo||'';em.routeToCC=sub.routeToCC||'';
          break;
        }
      }
    }
  }
  render();toast('Category updated &#10003;');
}

// ── Settings ──────────────────────────────────────────────────────────────────
async function ensureGuide(){if(guide===null)await loadGuide();}

function renderSettings(main){
  if(guide===null){main.innerHTML='<div class="loading">Loading&#8230;</div>';ensureGuide().then(()=>{if(tab==='settings')renderSettings(document.getElementById('main'));});return;}
  let out='<div class="wh-section"><div class="wh-title">Power Automate Webhook URLs</div>'+
    '<div class="wh-sub">Paste your HTTP trigger URLs from the info@ Action flows.</div>'+
    '<div class="wh-grid" style="margin-bottom:8px;">'+
      '<span class="wh-label">Approve</span><input id="wh-approve" class="wh-input" type="text" value="'+esc(webhooks.approve)+'" placeholder="https://prod-xx.westus.logic.azure.com/...">'+
      '<span class="wh-label">Ignore</span><input id="wh-ignore" class="wh-input" type="text" value="'+esc(webhooks.ignore)+'" placeholder="https://prod-xx.westus.logic.azure.com/...">'+
      '<span class="wh-label">Draft</span><input id="wh-draft" class="wh-input" type="text" value="'+esc(webhooks.draft)+'" placeholder="https://prod-xx.westus.logic.azure.com/...">'+
    '</div><div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;"><div class="wh-sub" style="margin-bottom:6px;">GitHub token — needed to update email status when you approve or ignore. Stored only in your browser.</div><div class="wh-grid"><span class="wh-label">GitHub token</span><input id="wh-github" class="wh-input" type="password" value="'+esc(webhooks.githubToken)+'" placeholder="ghp_..."></div></div><div style="text-align:right;margin-top:10px;"><button class="btn btn-g btn-sm" data-action="save-webhooks">Save</button></div></div>';
  out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'+
    '<div><h2 style="font-size:16px;font-weight:700;margin-bottom:4px;">Response Guide</h2>'+
    '<p style="font-size:13px;color:var(--text2);">Define how each type of email should be handled.</p></div>'+
    '<button class="btn btn-g" data-action="add-category">+ Add Category</button></div>';
  if(!guide.length){out+='<div class="empty"><div class="ic">&#128218;</div><h3>No categories yet</h3><p>Click Add Category to get started.</p></div>';main.innerHTML=out;return;}
  guide.forEach((cat,ci)=>{
    const subs=cat.subs||[];
    out+='<div class="guide-cat"><div class="guide-cat-hdr"><span class="guide-cat-name">'+esc(cat.name)+'</span>'+
      '<button class="btn btn-ghost btn-sm" data-action="edit-category" data-ci="'+ci+'">Rename</button> '+
      '<button class="btn btn-g btn-sm" data-action="add-sub" data-ci="'+ci+'">+ Add</button> '+
      '<button class="btn btn-del btn-sm" data-action="delete-category" data-ci="'+ci+'">Delete</button></div>';
    if(subs.length){subs.forEach((sub,si)=>{
      const ac=sub.action||'reply';
      const acBg=ac==='forward'?'var(--blue-l)':ac==='ignore'?'var(--bg)':ac==='reply_forward'?'var(--orange-l)':'var(--green-l)';
      const acCol=ac==='forward'?'var(--blue)':ac==='ignore'?'var(--text2)':ac==='reply_forward'?'var(--orange)':'var(--green)';
      out+='<div class="guide-sub"><div class="guide-sub-info"><div class="guide-sub-name">'+esc(sub.name)+'</div>'+
        '<div class="guide-sub-tags"><span class="tag" style="background:'+acBg+';color:'+acCol+';">'+ac+'</span>'+
        (sub.routeTo?'<span style="font-size:11px;color:var(--text2);">&#8594; '+esc(sub.routeTo)+'</span>':'')+
        (sub.claudeCategory?'<span style="font-size:11px;color:var(--text2);background:var(--bg);padding:1px 6px;border-radius:4px;">'+esc(CAT_LABELS[sub.claudeCategory]||sub.claudeCategory)+'</span>':'')+
        '</div>'+(sub.replyText?'<div class="guide-sub-preview">'+esc(sub.replyText.substring(0,120))+(sub.replyText.length>120?'&#8230;':'')+'</div>':'')+
        '</div><div style="display:flex;flex-direction:column;gap:4px;">'+
        '<button class="btn btn-ghost btn-sm" data-action="edit-sub" data-ci="'+ci+'" data-si="'+si+'">Edit</button>'+
        '<button class="btn btn-del btn-sm" data-action="delete-sub" data-ci="'+ci+'" data-si="'+si+'">Delete</button>'+
        '</div></div>';
    });}else{out+='<div class="guide-empty">No subcategories yet &#8212; click + Add</div>';}
    out+='</div>';
  });
  main.innerHTML=out;
}

function addCategory(){const name=prompt('Category name:');if(!name)return;if(!guide)guide=[];guide.push({id:'cat-'+Date.now(),name,subs:[]});saveGuideLocal();renderSettings(document.getElementById('main'));}
function editCategory(ci){const name=prompt('Rename:',guide[ci].name);if(!name)return;guide[ci].name=name;saveGuideLocal();renderSettings(document.getElementById('main'));}
function deleteCategory(ci){if(!confirm('Delete?'))return;guide.splice(ci,1);saveGuideLocal();renderSettings(document.getElementById('main'));}
function deleteSub(ci,si){if(!confirm('Delete?'))return;guide[ci].subs.splice(si,1);saveGuideLocal();renderSettings(document.getElementById('main'));}
function saveGuideLocal(){try{localStorage.setItem('panzi-guide',JSON.stringify(guide));}catch(e){}}

function openSubEditor(ci,si){
  const isNew=si===-1,sub=isNew?{name:'',action:'reply',routeTo:'',routeToCC:'',replyText:'',claudeCategory:''}:JSON.parse(JSON.stringify(guide[ci].subs[si]));
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal"><h3>'+(isNew?'Add':'Edit')+' subcategory</h3>'+
    '<div style="display:flex;flex-direction:column;gap:12px;">'+
    '<div class="field"><label class="field-label">Name</label><input id="sn" type="text" value="'+esc(sub.name)+'"></div>'+
    '<div class="field"><label class="field-label">Action</label><select id="sa">'+
      '<option value="reply"'+(sub.action==='reply'?' selected':'')+'>Reply to sender</option>'+
      '<option value="forward"'+(sub.action==='forward'?' selected':'')+'>Forward to colleague</option>'+
      '<option value="reply_forward"'+(sub.action==='reply_forward'?' selected':'')+'>Reply + Forward (urgent)</option>'+
      '<option value="ignore"'+(sub.action==='ignore'?' selected':'')+'>Ignore</option>'+
    '</select></div>'+
    '<div class="field"><label class="field-label">Claude category mapping</label><select id="scat">'+
      '<option value="">— None —</option>'+Object.entries(CAT_LABELS).map(kv=>'<option value="'+kv[0]+'"'+(sub.claudeCategory===kv[0]?' selected':'')+'>'+kv[1]+'</option>').join('')+
    '</select></div>'+
    '<div id="rf" style="display:flex;flex-direction:column;gap:8px;'+(sub.action==='ignore'||sub.action==='reply'?'display:none!important':'')+'">'+
      '<div class="field"><label class="field-label">Route To</label><input id="srt" type="text" value="'+esc(sub.routeTo||'')+'" placeholder="email@panzi.org (comma-separate multiple)"></div>'+
      '<div class="field"><label class="field-label">CC</label><input id="scc" type="text" value="'+esc(sub.routeToCC||'')+'" placeholder="optional"></div>'+
    '</div>'+
    '<div class="field"><label class="field-label">Reply text <span style="font-weight:400;text-transform:none;">(blank = Claude drafts)</span></label><textarea id="sr">'+esc(sub.replyText||'')+'</textarea></div>'+
    '</div><div class="modal-footer"><button class="btn btn-ghost" id="sc">Cancel</button><button class="btn btn-g" id="ss">Save</button></div></div>';
  document.body.appendChild(ov);
  const rfEl=ov.querySelector('#rf');
  ov.querySelector('#sa').addEventListener('change',function(){rfEl.style.display=(this.value==='ignore'||this.value==='reply')?'none':'flex';});
  ov.querySelector('#sc').addEventListener('click',()=>ov.remove());
  ov.querySelector('#ss').addEventListener('click',()=>{
    const updated={name:ov.querySelector('#sn').value.trim(),action:ov.querySelector('#sa').value,routeTo:ov.querySelector('#srt').value.trim(),routeToCC:ov.querySelector('#scc').value.trim(),replyText:ov.querySelector('#sr').value.trim(),claudeCategory:ov.querySelector('#scat').value};
    if(!updated.name){alert('Please enter a name.');return;}
    if(!guide[ci].subs)guide[ci].subs=[];
    if(isNew)guide[ci].subs.push(updated);else guide[ci].subs[si]=updated;
    saveGuideLocal();ov.remove();renderSettings(document.getElementById('main'));
  });
}

initAuth();
</script>
